services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: archives
      POSTGRES_PASSWORD: archives
      POSTGRES_DB: archives
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archives -d archives"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://archives:archives@db:5432/archives
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
